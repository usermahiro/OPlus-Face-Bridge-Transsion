[package]
name = "face-hal"
version = "1.0.0"
edition = "2021"
authors = ["ryanistr"]
license = "Apache-2.0"
description = "AIDL face HAL (android.hardware.biometrics.face.IFace) for Android, driving the front camera and the SenseTime face algorithm"
repository = "https://github.com/ryanistr/vendor-senseface-aidl"

# The staged filename is android.hardware.biometrics.face-service, but a Rust
# crate/bin name cannot contain '.', so the crate builds as face-hal-service and
# scripts/stage_vendor.sh installs it under the real name.
[[bin]]
name = "face-hal-service"
path = "src/main.rs"

# Device-side self test for the algorithm binding. Not shipped: scripts/
# stage_vendor.sh only installs face-hal-service.
[[bin]]
name = "face-selftest"
path = "src/selftest.rs"

[dependencies]
rsbinder = { version = "0.6.0", features = ["android_14"] }
async-trait = "0.1"
libc = "0.2"
# rsbinder reports parcel/dispatch failures through the `log` facade. Without a
# logger installed those messages go nowhere, which makes an unmarshal failure
# indistinguishable from a HAL that never received the transaction.
log = "0.4"

[build-dependencies]
rsbinder-aidl = "=0.6.0"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# rsbinder 0.6.0 panics on SDK 37 ("Unsupported Android SDK version: 37"), which
# kills the HAL at startup on Android 17 ROMs. third_party/rsbinder is 0.6.0
# unchanged except for mapping SDK 37 to the android_16 service manager (the same
# mapping rsbinder 0.12 uses). See third_party/rsbinder/src/hub/mod.rs.
[patch.crates-io]
rsbinder = { path = "third_party/rsbinder" }
