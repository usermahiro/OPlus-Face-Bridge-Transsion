name: Build Face HAL

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      hal_name:
        description: "Nama binary di /vendor/bin/hw"
        default: "android.hardware.biometrics.face-service.default"
      service_name:
        description: "Nama service init"
        default: "vendor.face-default"
      rc_name:
        description: "Nama file rc di /vendor/etc/init"
        default: "android.hardware.biometrics.face-service.rc"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: r27c
  ANDROID_API: "30"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HAL_NAME: ${{ inputs.hal_name || 'android.hardware.biometrics.face-service.default' }}
      SERVICE_NAME: ${{ inputs.service_name || 'vendor.face-default' }}
      RC_NAME: ${{ inputs.rc_name || 'android.hardware.biometrics.face-service.rc' }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Toolchain env
        run: |
          TC="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          test -x "$TC/bin/aarch64-linux-android${ANDROID_API}-clang" || { echo "NDK clang not found in $TC"; exit 1; }
          {
            echo "NDK_TC=$TC"
            echo "CC_aarch64_linux_android=$TC/bin/aarch64-linux-android${ANDROID_API}-clang"
            echo "AR_aarch64_linux_android=$TC/bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TC/bin/aarch64-linux-android${ANDROID_API}-clang"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS=-C link-arg=-fuse-ld=lld"
          } >> "$GITHUB_ENV"

      # Library vendor (libstfaceunlockppl, libcamera2ndk_vendor, libmediandk)
      # hanya ada di ROM. Untuk link di CI dibuat stub kosong; tidak ikut paket.
      - name: Link stubs
        run: |
          python3 scripts/ci_stubs.py src "$RUNNER_TEMP/stubrom" \
            "$NDK_TC/bin/aarch64-linux-android${ANDROID_API}-clang"
          echo "ROM_TREE=$RUNNER_TEMP/stubrom" >> "$GITHUB_ENV"

      - name: Build
        run: |
          grep -q 'ANDROID_16 | 37' third_party/rsbinder/src/hub/mod.rs || { echo 'rsbinder SDK37 patch missing'; exit 1; }
          cargo build --release --target aarch64-linux-android

      - name: Verify binary
        run: scripts/ci_verify.sh target/aarch64-linux-android/release/face-hal-service

      - name: Package ROM zip
        id: pkg
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="$GITHUB_REF_NAME"; else V="${GITHUB_SHA::8}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          VERSION="$V" scripts/ci_package.sh \
            target/aarch64-linux-android/release/face-hal-service dist
          ls -l dist

      - name: Upload ROM zip
        uses: actions/upload-artifact@v4
        with:
          name: face-hal-rom-${{ steps.pkg.outputs.version }}
          path: dist/face-hal-rom-${{ steps.pkg.outputs.version }}.zip
          if-no-files-found: error

      - name: Upload raw binary
        uses: actions/upload-artifact@v4
        with:
          name: face-hal-service-aarch64
          path: target/aarch64-linux-android/release/face-hal-service

      - name: Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', steps.pkg.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', steps.pkg.outputs.version) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            dist/face-hal-rom-${{ steps.pkg.outputs.version }}.zip
            target/aarch64-linux-android/release/face-hal-service
